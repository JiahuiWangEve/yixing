name: Build GPT branch Web

on:
  push:
    branches: [gpt]
    paths:
      - 'game/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/gpt-web.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gpt-web-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Godot and verify
        run: bash scripts/setup.sh
      - name: Install matching single-thread Web templates
        run: bash scripts/install-web-templates.sh
      - name: Export Web
        run: |
          mkdir -p build/web
          bin/godot --headless --path game --export-release Web ../build/web/index.html > build/export.log 2>&1
          cat build/export.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|(^|[[:space:]])ERROR:' build/export.log; then exit 1; fi
          python3 scripts/check_web_package.py build/web/index.pck > build/package-audit.log
          cat build/package-audit.log
          touch build/web/.nojekyll
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          pathlib.Path('build/web/build-info.json').write_text(json.dumps({
              'version': re.search(r'const BUILD_VERSION = "([^"]+)"', pathlib.Path('game/main.gd').read_text()).group(1), 'source_branch': 'gpt',
              'source_commit': os.environ['GITHUB_SHA'], 'godot': '4.6.3',
              'thread_support': False,
              'sha256': {name: hashlib.sha256(pathlib.Path('build/web', name).read_bytes()).hexdigest() for name in ['index.pck', 'index.wasm']}
          }, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Install browser test runtime
        run: |
          python3 -m pip install playwright==1.55.0 pillow==11.3.0
          python3 -m playwright install --with-deps chromium
      - name: Verify real Web map flows at four sizes
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory build/web > build/http.log 2>&1 &
          trap 'kill $!' EXIT
          if ! python3 tests/browser_map_checks.py > build/browser.log 2>&1; then cat build/browser.log; exit 1; fi
          cat build/browser.log
          if ! python3 tests/browser_cannon_checks.py > build/cannon-browser.log 2>&1; then cat build/cannon-browser.log; exit 1; fi
          cat build/cannon-browser.log
          if ! python3 tests/browser_rook_checks.py > build/rook-browser.log 2>&1; then cat build/rook-browser.log; exit 1; fi
          cat build/rook-browser.log
          if ! python3 tests/browser_event_checks.py > build/event-browser.log 2>&1; then cat build/event-browser.log; exit 1; fi
          cat build/event-browser.log
      - name: Upload verification and exported site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yixing-web-${{ github.sha }}
          path: |
            build/web/
            build/export.log
            build/package-audit.log
            build/browser.log
            build/cannon-browser.log
            build/rook-browser.log
            build/event-browser.log
            verification/v0.13.0/events/
            verification/v0.12.0/rook/
            verification/v0.11.0/cannon/
            verification/v0.13.0/browser/
            verification/latest/
          include-hidden-files: true
      - name: Commit Web export to gh-pages
        # Temporary release hold while the newly requested booklet rules are implemented.
        if: ${{ false }}
        run: |
          test "$(git ls-remote origin refs/heads/gpt | cut -f1)" = "$GITHUB_SHA" || { echo "Stale source; skip publication"; exit 0; }
          git fetch origin gh-pages
          git worktree add --detach publish FETCH_HEAD
          cp -a build/web/. publish/
          cd publish
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "Publish Web from gpt ${GITHUB_SHA}"
            git push origin HEAD:gh-pages
          fi
